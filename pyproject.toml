[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coreme"
dynamic = ["version"]
description = "AI-friendly automation kernel: durable Jobs, fleet agent, thin hub"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "coreme" }]
keywords = ["automation", "agent", "job-runner", "fleet", "scheduler", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Automation",
    "Intended Audience :: Developers",
    "Environment :: Console",
]
dependencies = [
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/coreme/coreme"
Repository = "https://github.com/coreme/coreme"
Changelog = "https://github.com/coreme/coreme/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/coreme/coreme/issues"

[project.optional-dependencies]
hub = [
    "psycopg[binary]>=3.2",
]
dev = [
    "mypy>=1.17,<1.18",
    "pytest>=8.0",
    "ruff>=0.12,<0.13",
    "psycopg[binary]>=3.2",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
coreme = "coreme.cli:main"
coreme-agent = "coreme_agent.cli:main"
coreme-hub = "coreme_hub.cli:main"

[tool.setuptools.dynamic]
version = { attr = "coreme.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coreme = ["agentdocs/*.md", "agentdocs/skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF", "PTH"]

# ctypes.Structure._fields_ is the Win32 layout, not a mutable app default.
[tool.ruff.lint.per-file-ignores]
"src/coreme/_process.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# ctypes WinDLL methods (CreateJobObjectW, …) are dynamically typed.
[[tool.mypy.overrides]]
module = ["coreme._process"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true

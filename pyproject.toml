[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coreme"
version = "0.1.0"
description = "Durable local automation Job runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "coreme" }]
dependencies = [
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<1.18",
    "pytest>=8.0",
    "ruff>=0.12,<0.13",
]

[project.scripts]
coreme = "coreme.cli:main"
coreme-agent = "coreme_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF", "PTH"]

# ctypes.Structure._fields_ is the Win32 layout, not a mutable app default.
[tool.ruff.lint.per-file-ignores]
"src/coreme/_process.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# ctypes WinDLL methods (CreateJobObjectW, …) are dynamically typed.
[[tool.mypy.overrides]]
module = ["coreme._process", "coreme.cli", "coreme_agent.executor"]
disable_error_code = ["attr-defined"]
